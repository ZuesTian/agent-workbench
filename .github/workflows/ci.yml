name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci
      - run: python -m pytest -q --tb=short --basetemp=.test-artifacts/pytest-ci
      - run: npm test
      - run: python -m ruff check agent_workbench tests launcher.py build_windows.py
      - run: npm run format:check
      - name: Isolated browser checks
        run: |
          python tests/execution_browser_controls.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/scheduling_browser_smoke.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/conversations_browser_smoke.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/reliability_smoke.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: python build_windows.py
      - name: Packaged browser checks
        run: |
          python tests/conversations_browser_smoke.py --exe dist/AgentWorkbench/AgentWorkbench.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/reliability_smoke.py --exe dist/AgentWorkbench/AgentWorkbench.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-verification
          path: |
            .test-artifacts/**/*.json
            .test-artifacts/**/*.png
            .test-artifacts/**/*.log
            releases/*/verification/
